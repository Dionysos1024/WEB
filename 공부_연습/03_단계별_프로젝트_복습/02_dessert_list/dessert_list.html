<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dessert_list</title>

    <link rel="stylesheet" href="css/dessert_list.css">
    <script src="script/dessert_list.js"></script>

</head>
<body>

        <!-- ========================================

        DAY 01 | 2026-10-16
        - HTML로 입력창, 추가 버튼, 빈 목록 구조 만들기
        - CSS로 기본 레이아웃과 스타일 적용하기
        - DOM 요소를 getElementById()로 선택하기
        - addEventListener()로 버튼 클릭 이벤트 연결하기
        - input의 value로 입력한 값 가져오기
        - createElement()로 새로운 li 요소 생성하기
        - textContent로 li 요소에 입력한 글자 넣기
        - appendChild()로 목록에 새로운 요소 추가하기
        - 버튼을 여러 번 눌러 목록에 항목이 누적되는지 확인하기

        DAY 02 | 2026-10-17
        - if 조건문으로 빈 입력값일 때 목록에 추가되지 않도록 처리하기
        - !== 연산자로 입력값이 빈 문자열인지 확인하기
        - 입력값을 추가한 뒤 dessertInput.value = ""로 입력창 비우기
        - dessertInput.focus()로 입력창에 포커스 주기
        - keydown 이벤트와 event.key로 Enter 키 입력 감지하기
        - addBtn.click()으로 Enter 키와 기존 추가 버튼 기능 연결하기
        - createElement('button')으로 디저트별 삭제 버튼 생성하기
        - textContent로 삭제 버튼에 글자 넣기
        - appendChild()로 삭제 버튼을 li 요소 안에 넣기
        - addEventListener()로 각 삭제 버튼에 클릭 이벤트 연결하기
        - remove()로 선택한 디저트 목록 항목 삭제하기
        - CSS 입력창의 커서 위치 조정하기
        - 디저트 추가, 빈 입력 방지, Enter 키 입력, 개별 삭제 기능 테스트하기

        DAY 03 | 2026-10-18
        - CSS body에 background-color를 적용해 페이지 배경을 연한 라벤더색으로 변경하기
        - .inner에 흰색 배경을 적용해 디저트 목록 박스를 돋보이게 만들기
        - #dessertList li에 margin-bottom과 padding을 적용해 목록 간격 조절하기
        - #dessertList button의 margin-left로 디저트 이름과 삭제 버튼 사이 간격 조절하기
        - 삭제 버튼의 배경색과 글자색을 변경해 전체 디자인 통일하기
        - border-radius로 목록 항목의 모서리를 둥글게 만들기
        - :hover 선택자로 삭제 버튼에 마우스 오버 효과 적용하기
        - :hover 선택자로 디저트 목록 항목의 배경색과 글자색 변경하기
        - transition: all 0.2s로 스타일 변화 부드럽게 만들기
        - CSS 선택자로 JavaScript에서 동적으로 생성한 li와 button 요소 스타일 적용하기
        - 브라우저에서 디저트 추가, Enter 키 입력, 빈 입력 방지, 입력창 초기화 및 개별 삭제 기능 최종 테스트하기
        - CSS 디자인과 JavaScript 기능을 점검하고 dessert_list 2단계 프로젝트 완성하기

        ======================================== -->




    <div class="container">

        <h1>나만의 디저트 리스트</h1>

        <div class="section">
            <input type="text" id="dessertInput">
            <button id="addBtn">추가</button>
        </div>

        <div class="inner">

            <h2>디저트 목록</h2>

            <ul id="dessertList">

            </ul>

        </div>
    </div>
    
</body>
</html>
