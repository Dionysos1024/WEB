<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화 기록장</title>

    <link rel="stylesheet" href="css/movie_log.css">

    <script src="script/movie_log.js" defer></script>

</head>
<body>

    <!-- ========================================

    DAY 01 | 2026-10-21
        - HTML 기본 구조 및 영화 기록장 영역 구성
        - 영화 목록과 감상 관리 영역 설계
        - CSS, JavaScript 파일 연결

    DAY 02 | 2026-10-22
        - CSS 기본 레이아웃 구성
        - Flex를 활용한 가로·세로 배치
        - 영역별 크기와 디자인 설정

    DAY 03 | 2026-10-23
        - DOM 요소 선택 및 생성
        - textContent와 appendChild() 활용
        - 영화 제목 화면 출력 성공

    DAY 04 | 2026-10-27
        - 영화 카드 HTML 요소 생성
        - 이미지와 제목을 카드에 추가
        - CSS 카드 디자인 및 Grid 레이아웃 구성
        - movies 배열에 영화 정보 정리

    DAY 05 | 2026-10-28
        - forEach()로 영화 배열 데이터 반복 처리
        - 배열 정보를 이용해 영화 카드 생성
        - 영화 카드 3장 화면 출력 확인

    DAY 06 | 2026-11-03
        - 영화 카드마다 '보고 싶어요' 버튼 생성
        - 클릭 이벤트로 보고 싶은 영화 목록에 추가
        - '감상 완료' 버튼으로 영화 목록 이동
        - 삭제 버튼으로 영화 항목 제거
        - 중첩 클릭 이벤트와 DOM 요소 이동·삭제 실습
        - 브라우저에서 주요 기능 정상 작동 확인
        - 영화 기록장 핵심 기능 구현 완료

    ======================================== -->


    
    <div class="container"> <!-- 전체를 감싸는 container 시작 -->

        <h1>나만의 영화 기록장</h1>
        <span>취향저격 나만의 Movie log</span>

        <div class="inner"> <!-- 목록 과 관리 두 박스 감싸는 inner 시작 -->

            <div id="movielist" class="list"> <!-- 카드 3개 묶을 .list 시작 -->

                    <!-- 카드 생성은 js 에서 할거임 -->

            </div> <!-- 카드 3개 묶을 list 끝 -->  

            <div id="manage"> <!-- 영화 감상 관리 #manage 시작 -->

                <div class="manage">    <!-- 보고싶은거 . 다 본거 감싸는 .manage 시작 -->

                    <div class="want"> <!-- 보고싶은 영화 시작 -->

                        <h2>보고싶은 영화</h2>

                        <ul id="wantList">
                            <!-- li 는 js 에서 생성 할거임 -->
                        </ul>

                    </div>  <!-- 보고싶은 영화 끝 -->

                    <div class="watched"> <!-- 감상 완료 영화 시작 -->

                        <h2>감상 완료 영화</h2>

                        <ul id="watchedList">
                            <!-- li 는 js 에서 생성 할거임 -->
                        </ul>

                    </div>  <!-- 감상 완료 영화 끝 -->

                </div>  <!-- 보고싶은거 . 다 본거 감싸는 .manage 끝 -->

            </div>  <!-- 영화 감상 관리 .manage 끝 -->

        </div>  <!-- 목록 과 관리 두 박스 감싸는 inner 끝 -->

    </div>  <!-- 전체를 감싸는 container 끝 -->

</body>
</html>
