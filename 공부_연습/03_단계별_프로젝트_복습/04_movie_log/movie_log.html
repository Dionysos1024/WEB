<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화 기록장</title>

    <link rel="stylesheet" href="css/movie_log.css">

    <script src="script/movie_log.js" defer></script>

</head>
<body>

    <!-- ========================================

    DAY 01 | 2026-10-21
        - HTML 기본 구조 설계
        - 페이지 제목과 소개 문구 작성
        - 영화 목록 영역 구성 (#movielist)
        - 감상 관리 영역 구성 (#manage)
        - 보고 싶은 영화 목록 준비 (#wantList)
        - 감상 완료 영화 목록 준비 (#watchedList)
        - CSS 파일과 JavaScript 파일 연결
        - defer를 사용해 JavaScript 실행 순서 설정
        - HTML 구조 설계 완료
        
    DAY 02 | 2026-10-22
        - 최종 목표 화면과 CSS 디자인 방향 확인
        - 영화 목록과 감상 관리 영역의 가로 배치
        - display: flex를 활용한 레이아웃 구성
        - 영화 감상 관리 영역의 세로 배치
        - 영역별 너비, 높이, 배경색, 테두리 설정
        - 브라우저에서 레이아웃 확인
        - 기본 레이아웃 구성 진행 중

        다음 단계:
        DAY 02 이어서 | CSS 레이아웃 마무리
        - 소개 문구 가운데 정렬
        - 관리 영역 내부 간격 조절
        - 목표 화면에 맞춰 CSS 스타일 보완
        - CSS 정리 후 JavaScript 단계로 이동

    ======================================== -->


    
    <div class="container"> <!-- 전체를 감싸는 container 시작 -->

        <h1>나만의 영화 기록장</h1>
        <span>취향저격 나만의 Movie log</span>

        <div class="inner"> <!-- 목록 과 관리 두 박스 감싸는 inner 시작 -->

            <div id="movielist" class="list"> <!-- 카드 3개 묶을 .list 시작 -->

                    <!-- 카드 생성은 js 에서 할거임 -->

            </div> <!-- 카드 3개 묶을 list 끝 -->  

            <div id="manage"> <!-- 영화 감상 관리 #manage 시작 -->

                <div class="manage">    <!-- 보고싶은거 . 다 본거 감싸는 .manage 시작 -->

                    <div class="want"> <!-- 보고싶은 영화 시작 -->

                        <h2>보고싶은 영화</h2>

                        <ul id="wantList">
                            <!-- li 는 js 에서 생성 할거임 -->
                        </ul>

                    </div>  <!-- 보고싶은 영화 끝 -->

                    <div class="watched"> <!-- 감상 완료 영화 시작 -->

                        <h2>감상 완료 영화</h2>

                        <ul id="watchedList">
                            <!-- li 는 js 에서 생성 할거임 -->
                        </ul>

                    </div>  <!-- 감상 완료 영화 끝 -->

                </div>  <!-- 보고싶은거 . 다 본거 감싸는 .manage 끝 -->

            </div>  <!-- 영화 감상 관리 .manage 끝 -->

        </div>  <!-- 목록 과 관리 두 박스 감싸는 inner 끝 -->

    </div>  <!-- 전체를 감싸는 container 끝 -->

</body>
</html>
