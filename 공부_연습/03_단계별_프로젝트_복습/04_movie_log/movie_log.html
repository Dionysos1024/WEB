<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화 기록장</title>

    <link rel="stylesheet" href="css/movie_log.css">

    <script src="script/movie_log.js" defer></script>

</head>
<body>

    <!-- ========================================

    DAY 01 | 2026-10-21
        - HTML 기본 구조 설계
        - 페이지 제목과 소개 문구 작성
        - 영화 목록 영역 구성 (#movielist)
        - 감상 관리 영역 구성 (#manage)
        - 보고 싶은 영화 목록 준비 (#wantList)
        - 감상 완료 영화 목록 준비 (#watchedList)
        - CSS 파일과 JavaScript 파일 연결
        - defer를 사용해 JavaScript 실행 순서 설정
        - HTML 구조 설계 완료
        
    DAY 02 | 2026-10-22
        - 최종 목표 화면과 CSS 디자인 방향 확인
        - 영화 목록과 감상 관리 영역의 가로 배치
        - display: flex를 활용한 레이아웃 구성
        - 영화 감상 관리 영역의 세로 배치
        - 영역별 너비, 높이, 배경색, 테두리 설정
        - 브라우저에서 레이아웃 확인
        - 기본 레이아웃 구성 진행 중

    DAY 03 | 2026-10-23
        - JavaScript와 HTML 요소 연결 연습
        - getElementById()로 영화 목록 영역 찾기
        - createElement()로 새로운 p 요소 생성
        - textContent로 영화 제목 넣기
        - appendChild()로 영화 목록에 요소 추가
        - DOM 요소 생성 및 추가 과정 실습
        - 부모 요소와 자식 요소의 역할 구분 연습
        - 영화 제목 '라라 랜드' 화면 출력 성공

    DAY 04 | 2026-10-27
        - 기존 DOM 코드 복습
        - createElement()로 div, img, p 요소 생성
        - div를 영화 카드의 부모 요소로 활용
        - 영화 제목과 포스터 이미지 설정
        - className으로 movie-card 클래스 지정
        - appendChild()로 이미지와 제목을 카드 안에 추가
        - 완성한 카드를 #movielist 안에 추가
        - DOM 요소의 부모·자식 관계 구성 완료
        - CSS로 영화 카드의 style 설정
        - 포스터 크기와 제목의 글꼴 및 정렬 설정
        - .list에 CSS Grid 레이아웃 적용
        - 영화 카드의 가로 배치와 간격 설정
        - 브라우저에서 카드 디자인 및 배치 확인
        - movies 배열에 영화 제목과 이미지 주소 정리
        - 영화 정보 배열 작성 완료

     DAY 05 | 2026-10-28
        - 기존 영화 카드 생성 코드 복습
        - forEach()를 활용해 배열의 영화 정보를 하나씩 처리
        - 반복문 내부에서 영화 카드 요소 생성
        - 반복 매개변수로 현재 영화 객체 전달받기
        - 객체의 title 속성으로 영화 제목 설정
        - 객체의 image 속성으로 이미지 주소 설정
        - 기존 카드 구조를 반복문 안에서 재사용
        - appendChild()로 각 영화 카드를 목록 영역에 추가
        - 배열 데이터를 이용해 영화 카드 3장 생성
        - 브라우저에서 라라 랜드, 기생충, 인사이드 아웃 출력 확인

    ======================================== -->


    
    <div class="container"> <!-- 전체를 감싸는 container 시작 -->

        <h1>나만의 영화 기록장</h1>
        <span>취향저격 나만의 Movie log</span>

        <div class="inner"> <!-- 목록 과 관리 두 박스 감싸는 inner 시작 -->

            <div id="movielist" class="list"> <!-- 카드 3개 묶을 .list 시작 -->

                    <!-- 카드 생성은 js 에서 할거임 -->

            </div> <!-- 카드 3개 묶을 list 끝 -->  

            <div id="manage"> <!-- 영화 감상 관리 #manage 시작 -->

                <div class="manage">    <!-- 보고싶은거 . 다 본거 감싸는 .manage 시작 -->

                    <div class="want"> <!-- 보고싶은 영화 시작 -->

                        <h2>보고싶은 영화</h2>

                        <ul id="wantList">
                            <!-- li 는 js 에서 생성 할거임 -->
                        </ul>

                    </div>  <!-- 보고싶은 영화 끝 -->

                    <div class="watched"> <!-- 감상 완료 영화 시작 -->

                        <h2>감상 완료 영화</h2>

                        <ul id="watchedList">
                            <!-- li 는 js 에서 생성 할거임 -->
                        </ul>

                    </div>  <!-- 감상 완료 영화 끝 -->

                </div>  <!-- 보고싶은거 . 다 본거 감싸는 .manage 끝 -->

            </div>  <!-- 영화 감상 관리 .manage 끝 -->

        </div>  <!-- 목록 과 관리 두 박스 감싸는 inner 끝 -->

    </div>  <!-- 전체를 감싸는 container 끝 -->

</body>
</html>
