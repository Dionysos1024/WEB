<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>쿠폰 적용</title>
</head>
<body>

    <!-- [브라우저 실전 07번]

    사용할 문법과 역할:
    - getElementById(): HTML 요소 선택
    - addEventListener(): 버튼 클릭 이벤트 등록
    - checkbox.checked: 체크박스가 선택되었는지 확인
    - if / else: 쿠폰 적용 여부에 따라 계산
    - textContent: 결과를 화면에 표시

    요구사항:
    1. 상품 금액은 12000원이다.
    2. 체크박스가 선택되어 있으면 10% 할인한다.
    3. 선택되어 있지 않으면 원래 금액을 유지한다.
    4. 확인 버튼을 눌렀을 때 결과를 resultText에 표시한다.

    확인 결과:
    - 쿠폰 선택 → 쿠폰 적용 금액: 10800원
    - 쿠폰 미선택 → 쿠폰 미적용 금액: 12000원 -->

  <h2>쿠폰 적용 확인</h2>

  <p>상품 금액: 12000원</p>

  <label>
    <input id="couponCheck" type="checkbox">
    10% 할인 쿠폰 사용
  </label>

  <button id="applyBtn">금액 확인</button>
  <p id="resultText">쿠폰 적용 여부를 선택해 주세요.</p>

  <script>
    
    document.addEventListener("DOMContentLoaded", () => {

      const check = document.getElementById('couponCheck')
      const btn = document.getElementById('applyBtn')
      const resultText = document.getElementById('resultText')

      btn.addEventListener("click", () => {

        const price = 12000
        let result = price

        if ( check.checked ) {
            ( result = 12000 - 12000 / 10 )
            resultText.textContent = `쿠폰 적용 금액: ${result}원`
            return
        }

        else
          resultText.textContent = `쿠폰 미적용 금액: ${result}원`

      })
    })

  </script>
</body>
</html>
