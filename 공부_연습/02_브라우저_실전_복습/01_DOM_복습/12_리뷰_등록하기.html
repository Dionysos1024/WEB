<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리뷰 등록하기</title>
</head>
<body>
    
<!--
        [브라우저 실전 12번]

        목표: 사용자가 작성한 리뷰를 페이지에 추가하는 기능

        요구사항:
        1. 리뷰 등록 버튼을 누르면 작성한 내용을 가져온다.
        2. 내용이 비어 있다면 등록 안내 메시지를 표시한다.
        3. 내용이 있다면 새로운 목록 항목을 만들어 리뷰를 추가한다.
        4. 리뷰가 추가될 때마다 등록된 리뷰 개수를 갱신한다.
        5. 리뷰 등록 후 입력창을 비운다.
        6. 리뷰를 여러 개 등록할 수 있어야 한다.

        새롭게 활용할 기능:
        - document.createElement()
        - appendChild()

        확인 결과:
        - 리뷰 1개 등록 → 등록된 리뷰: 1개
        - 리뷰 3개 등록 → 등록된 리뷰: 3개
        - 빈 내용 등록 → 등록되지 않음
-->

  <h2>상품 리뷰</h2>

  <textarea id="reviewInput" placeholder="상품 리뷰를 작성해 주세요."></textarea>

  <button id="addReviewBtn">리뷰 등록</button>

  <p id="reviewCount">등록된 리뷰: 0개</p>

  <ul id="reviewList"></ul>

  <script>

  </script>

</body>
</html>
