

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>좌석 예약 관리</title>
</head>
<body>

<!--
        [브라우저 실전 15번]

        목표: 여러 좌석의 예약 상태를 관리하기

        요구사항:
        1. 각 좌석의 예약 가능 버튼을 누르면 예약 완료로 변경한다.
        2. 예약 완료 버튼을 다시 누르면 예약 가능으로 변경한다.
        3. 예약된 좌석 수를 화면에 표시한다.
        4. 남은 좌석 수도 함께 표시한다.
        5. 좌석 버튼마다 개별적으로 클릭 이벤트를 등록한다.
        6. 좌석 버튼을 하나씩 직접 선택하지 말고 반복문으로 처리한다.
        7. 전체 초기화 버튼을 누르면 모든 좌석을 예약 가능으로 변경한다.
        8. 초기화 후 예약을 다시 진행해도 정상 작동해야 한다.
        9. 예약 완료 상태일 때는 버튼의 배경색도 변경한다.

        새롭게 조합할 내용:
        - getElementsByTagName()
        - HTMLCollection의 length와 인덱스 접근
        - 반복문으로 여러 요소에 이벤트 등록하기
        - if / else 조건문
        - 변수로 예약 상태 관리하기
        - textContent와 style 변경
        - 초기화 기능

        확인 결과:
        - 1번, 3번, 5번 좌석 예약 → 예약 3개 / 남은 좌석 2개
        - 3번 좌석 다시 클릭 → 예약 2개 / 남은 좌석 3개
        - 전체 초기화 → 예약 0개 / 남은 좌석 5개
        - 초기화 후 다시 예약 → 정상 작동

        주의:
        예약 완료된 좌석을 다시 클릭하면 예약이 취소되어야 한다.
-->

  <h2>좌석 예약</h2>

  <div id="seatArea">
    <p>1번 좌석 <button>예약 가능</button></p>
    <p>2번 좌석 <button>예약 가능</button></p>
    <p>3번 좌석 <button>예약 가능</button></p>
    <p>4번 좌석 <button>예약 가능</button></p>
    <p>5번 좌석 <button>예약 가능</button></p>
  </div>

  <hr>

  <p id="bookedText">예약된 좌석: 0개</p>
  <p id="remainText">남은 좌석: 5개</p>

  <button id="resetBtn">전체 초기화</button>

  <script>

  </script>

</body>
</html>
