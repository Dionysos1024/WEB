<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>할인 가격 계산기</title>
</head>
<body>

    <!-- [브라우저 실전 05번]

    사용할 문법과 역할:
    - getElementById(): HTML 요소 선택
    - addEventListener(): 버튼 클릭 시 실행할 작업 등록
    - input.value: 입력한 값 읽기
    - Number(): 입력값을 숫자로 변환
    - if / else: 조건에 따라 계산 결과 구분
    - textContent: 결과를 화면에 표시

    요구사항:
    1. 가격이 비어 있으면 "가격을 입력해 주세요." 표시
    2. 가격이 20000원 이상이면 10% 할인
    3. 20000원 미만이면 할인 없이 원래 금액 표시
    4. 결과는 resultText에 표시
    5. 버튼을 누를 때마다 입력된 가격으로 다시 계산

    확인할 값:
    - 20000 입력 → 할인 후 가격: 18000원
    - 10000 입력 → 할인 대상이 아닙니다. 결제 금액: 10000원 -->
    


  <h2>할인 가격 계산기</h2>

  <label for="priceInput">상품 가격</label>
  <input id="priceInput" type="number" placeholder="가격 입력">
  <button id="calcBtn">할인 계산</button>

  <p id="resultText">금액을 입력하세요.</p>

  <script>

      const priceInput = document.getElementById("priceInput");
      const calcBtn = document.getElementById("calcBtn");
      const resultText = document.getElementById("resultText");

      calcBtn.addEventListener("click", function() {

        if ( priceInput.value === "" ) {
            resultText.textContent = "가격을 입력해 주세요"
            return
        }
           let price = Number(priceInput.value)
        
        if ( price >= 20000 ) {
          let result = price - price / 10
          resultText.textContent = `할인 후 가격 : ${result}원`
        }

        else
        resultText.textContent = `할인 대상이 아닙니다. 결제금액 : ${price}원`
        
      })

  </script>
</body>
</html>
