

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 검색</title>
</head>
<body>

<!--
        [브라우저 실전 14번]

        목표: 검색어를 입력해서 상품 목록에서 원하는 상품 찾기

        요구사항:
        1. 검색창에 상품명을 입력하고 검색 버튼을 누른다.
        2. 입력한 글자가 포함된 상품만 화면에 표시한다.
        3. 검색 결과가 몇 개인지 화면에 표시한다.
        4. 검색 결과가 없다면 "검색 결과가 없습니다."라고 표시한다.
        5. 검색어가 비어 있다면 안내 메시지를 표시한다.
        6. 전체 상품 보기 버튼을 누르면 모든 상품을 다시 표시한다.
        7. 전체 상품 보기 버튼을 누르면 검색창도 비운다.

        새롭게 활용할 기능:
        - 문자열의 includes() 메서드
        - 반복문으로 여러 상품 검사하기
        - 조건에 따른 요소 표시 및 숨기기

        확인 결과:
        - "주스" 검색 → 3개
        - "쿠키" 검색 → 1개
        - "없는상품" 검색 → 검색 결과가 없습니다.
        - 검색어 없이 검색 → 입력 안내 메시지
        - 전체 상품 보기 → 6개

        참고:
        includes()는 문자열 안에 특정 글자가 포함되어 있는지
        확인하는 기능이다.
        자세한 사용법은 문제를 풀 때 설명을 요청해도 된다.
-->

  <h2>상품 검색</h2>

  <input type="text" id="searchInput" placeholder="상품명을 입력하세요">

  <button id="searchBtn">검색</button>
  <button id="allBtn">전체 상품 보기</button>

  <p id="resultText">상품을 검색해 보세요.</p>

  <ul id="productList">
    <li>사과 주스 - 3,500원</li>
    <li>당근 주스 - 2,500원</li>
    <li>초코 쿠키 - 1,800원</li>
    <li>레몬 쿠키 - 2,200원</li>
    <li>우유 - 2,000원</li>
    <li>딸기 주스 - 4,000원</li>
  </ul>

  <script>
    const searchInput = document.getElementById('searchInput')
    const searchBtn = document.getElementById('searchBtn')
    const allBtn = document.getElementById('allBtn')
    const resultText = document.getElementById('resultText')
    const productList = document.getElementsByTagName('li')

    searchBtn.addEventListener("click", () => {

      let count = 0
      let searchText = searchInput.value

      if ( searchText === "" ) {
          resultText.textContent = "검색어 를 입력해주세요"
      }
      else {

      for (let item = 0; item < productList.length; item++) {
          
      let productText = productList[item].textContent
          
      if ( productText.includes(searchText) ) {
        productList[item].style.display = ""
        count = count + 1
      }

      else
      productList[item].style.display = "none"
    }

      if ( count === 0 )
      resultText.textContent = ` 검색 결과가 없습니다. `

      else
        resultText.textContent = `${count}`

      }
    })

    allBtn.addEventListener("click", () => {

      for (let i = 0; i < productList.length; i++) {
      
        productList[i].style.display = ""
        
      }
        resultText.textContent = ""
        searchInput.value = ""
    })
    
  </script>

</body>
</html>
