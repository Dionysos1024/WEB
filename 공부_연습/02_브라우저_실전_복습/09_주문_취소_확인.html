<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주문 취소 확인</title>
</head>
<body>

  <!--  [브라우저 실전 09번]

    사용할 문법과 역할:
    - getElementById(): HTML 요소 선택
    - addEventListener(): 버튼 클릭 이벤트 등록
    - confirm(): 확인 또는 취소 선택받기
    - if / else: 선택 결과에 따라 처리
    - textContent: 결과를 화면에 표시

    요구사항:
    1. 주문 취소 버튼을 누르면 확인 창을 띄운다.
    2. 확인을 누르면
       "주문 취소가 완료되었습니다."를 표시한다.
    3. 취소를 누르면
       "주문 취소를 진행하지 않았습니다."를 표시한다.
    4. 버튼을 다시 눌러도 결과가 갱신되어야 한다.

    확인 결과:
    - 확인 선택 → 주문 취소가 완료되었습니다.
    - 취소 선택 → 주문 취소를 진행하지 않았습니다.  -->

  <h2>주문 취소 확인</h2>

  <p>현재 상태: 주문 처리 대기</p>

  <button id="cancelBtn">주문 취소</button>

  <p id="resultText">주문 취소 여부를 확인해 주세요.</p>

  <script>

    document.addEventListener("DOMContentLoaded", () => {

    const cancelBtn = document.getElementById('cancelBtn')
    const resultText = document.getElementById('resultText')

    cancelBtn.addEventListener("click", () => {

      let result = confirm("주문 취소 하시겠습니까?")

      if ( result == true )
          resultText.textContent = ("주문 취소가 완료 되었습니다.")

      else
          resultText.textContent = ("주문 취소를 진행하지 않았습니다.")

      })

    })

      
    

  </script>

</body>
</html>
