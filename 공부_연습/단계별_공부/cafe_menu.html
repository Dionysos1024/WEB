<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cafe Menu</title>

    <script>

        // 매일 조금씩 코드 사용 하고, 이해하고, 연결하고, 익숙해지는 공부 ( 02일 차 완료 )

        // ========================================

        // DAY 01 | 2026-10-12
        // - DOM 요소 선택하기
        // - 버튼 클릭 이벤트 연결하기
        // - textContent로 메뉴 이름 변경하기

        // DAY 02 | 2026-10-13
        // - 변수로 메뉴 상태 기억하기
        // - if / else로 메뉴 번갈아 변경하기
        // - ! 연산자로 상태 전환하기
        // - 현재 선택한 메뉴 안내하기

        // ========================================



        document.addEventListener("DOMContentLoaded", () => {

            const menuItem = document.getElementById('menu');
            const changeBtn = document.getElementById('changeBtn');
            const pick = document.getElementById('pick');

            let strawBerry = 0

            changeBtn.addEventListener("click", () => {

            if ( strawBerry )
                { ( menuItem.textContent = "딸기 케이크" );
                    ( pick.textContent = ` 현재 선택한 메뉴 : ${menuItem.textContent} `)
                }
            
            else
                { ( menuItem.textContent = "초코 케이크" );
                    ( pick.textContent = ` 현재 선택한 메뉴 : ${menuItem.textContent} `)
                    }

            ( strawBerry = !strawBerry ) 

           })

        })


    </script>


</head>
<body>
    
    <div class="container">

        <h1>오늘의 카페</h1>

        <p id="menu">딸기 케이크</p>

        <p id="pick">메뉴 이름</p>

        <button id="changeBtn">메뉴 변경</button>

    </div>
</body>
</html>
