<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>합계</title>

    <script>
        let arr = [1,2,3,4,5]

        document.write(`합계 : ${sum(arr)}`)

        // 합계를 구하는 함수

        function sum( arr ) {
            let sum = 0     // 합계를 담을 변수
            // 배열을 반복해서 요소를 하나씩 합계에 더한다.
            for (let i = 0; i < arr.length; i++) {
                sum += arr[i]
            }
            return sum      // 함수를 호출한 곳으로 합계를 반환한다.
        }
    </script>
</head>

</body>
</html>
