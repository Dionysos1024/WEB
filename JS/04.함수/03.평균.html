<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>평균</title>

    <script>
        let arr = [1,2,5]

        document.write(`<h1>합계 : ${ sum(arr) }</h1>`)
        document.write(`<h1>평균 : ${ avg(arr).toFixed(2) }</h1>`)
        // Number.toFixed(자리수)
        // : 소수점을 지정한 자리수만 나타내어 반환하는 함수

        // 합계를 구하는 함수
        function sum( arr ) {
            let sum = 0
            for (let i = 0; i < arr.length; i++) {
                sum += arr[i];
                
            }
            return sum
        }

        // 평균을 구하는 함수
        function avg( arr ) {
            let avg = sum(arr) / arr.length
            return avg
        }

    </script>
</head>
<body>
    
</body>
</html>
