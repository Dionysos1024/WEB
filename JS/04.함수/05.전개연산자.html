<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전개연산자</title>
    <script>
        // 전개연산자
        function sample( a, b, c ) {
            document.write(`<h1> a : ${a} </h1>`)
            document.write(`<h1> b : ${b} </h1>`)
            document.write(`<h1> c : ${c} </h1>`)
        }
        const arr = [1,2,3]
        sample( ...arr )
        // 전개 연산자
        // : 배열의 요소를 하나씩 펼쳐서(전개) 전달한다.
    </script>
</head>
<body>
    
</body>
</html>
