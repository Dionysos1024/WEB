<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시계</title>
    <script>
        setInterval(() => {
            let timer = new Date()           // 현재 날짜시간 객체
            let h = timer.getHours()         // 시
            let m = timer.getMinutes()       // 분
            let s = timer.getSeconds()       // 초
            let time = `${h} : ${m} : ${s}`
            document.getElementById('time').innerHTML = time
            // document.getElementById()    : id 로 html 요소를 선택하는 함수
            // innerHTML                    : html 요소의 컨텐츠
        }, 1000);
    </script>
</head>
<body>
    <h1 id="time"></h1>
</body>
</html>
