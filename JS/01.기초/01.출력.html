<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이트 제목</title>
    <!-- HTML 안에서 <script> 태그 안에 자바스크립트 코드를 작성한다. -->
    <!-- 위치1 : <head> 태그 안 -->
        <script>
            // log : console.log() 자동 완성 -> F12 개발자도구 콘솔탭에서 확인
            console.log('자바스크립트 기본 출력');

            // 경고창 : 브라우저 객체 모델을 통한 출력
            alert('자바스크립트 경고창 출력')

            // html 출력 : 문서 객체 모델을 통한 출력
            document.write('문서 객체 모델을 통한 출력')
            
        </script>
</head>
<body>

    <!-- 위치2 : <body> 태그 안 맨 끝 -->
</body>
</html>
