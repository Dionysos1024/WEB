<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요소 생성</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h2>상품 카드 생성</h2>

        <div class="input-box">
            <input type="text" id="productName" placeholder="상품명 입력">
        </div>
        <div class="input-box">
            <input type="text" id="productImg" placeholder="이미지 URL 입력">
        </div>
        <div class="input-box">
            <input type="text" id="productPrice" placeholder="가격 입력">
        </div>

        <div>
            <button id="add">상품 추가</button>
        </div>
        <div id="productList"></div>
    </div>
    <script src="script/script.js"></script>
</body>
</html>
