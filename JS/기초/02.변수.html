<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>변수</title>

    <script>
        // 변수      : 데이터를 저장하는 공간
        // let       : 변수 선언
        // var       : 예전 변수 선언 방식
        // const     : 상수 선언 (값을 바꿀 수 없다.)

        // 변수 선언 문법
        // - let 변수명 = 값;
        let a = 10;
        let b = 20;
        let sum = a + b;

        const PI = 3.14;

        console.log('sum : ' + sum);
        console.log('PI : ' + PI);

        // const : 값 변경 불가
        // PI = 3.1415;
        
        // let : 값 변경 가능
        let x = 100
        x = 200

        // let : 중복 선언 불가
        let name = '홍길동'
        // let name = '김철수'

        // 값이 없는 변수
        let test;
        console.log(test);

        // null 은 값이 없음을 의미
        let test2 = null;
        console.log(test2);

        // undefined : 타입도 없고 값도 없는 것을 의미
        // null      : 타입은 object, 값이 없음을 의미
        
    </script>
</head>
<body>
    
</body>
</html>
