<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>객체 생성자 함수</title>
    <script>

        // 객체 생성자 함수 정의
        function student(name, age, major) {
            // 속성 정의
            this.name = name
            this.age = age
            this.major = major

            // 함수 정의
            this.print = function() {
                return `${this.name} : ${this.age} : ${this.major}`
            }
        }

        
        // 객체 생성
        let student1 = new student('원이', 20, '방송연예과')
        let student2 = new student('미나미', 22, '컴퓨터공학과')
        let student3 = new student('리브', 20, '정보통신공학과')


        // 객체 속성 출력
        document.write(`<h3>이름 : ${student1.name}</h3>`)
        document.write(`<h3>나이 : ${student1.age}</h3>`)
        document.write(`<h3>전공 : ${student1.major}</h3>`)
        document.write(`<p> ${ student1.print() } </p>`)

        document.write(`<hr>`)
        document.write(`<p>${student2.print()}</p>`)
        document.write(`<p>${student3.print()}</P>`)

    </script>
</head>
<body>
    
</body>
</html>
