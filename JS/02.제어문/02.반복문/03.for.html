<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for 문</title>
    <script>
        // for( [초기식] ; [조건식] ; [증감식] ) { [실행문] }
        for( let i = 1 ; i <= 10 ; i++ ) {
            console.log(i);
        }

        /*
            (실행 순서)
            [초기식] ㅡ> <반복> (조건식 ㅡ> 실행문 ㅡ> 증감식)
        */
    </script>
</head>

</html>
