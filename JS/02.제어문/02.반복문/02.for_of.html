<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for ~ of 반복문</title>
    <script>
        // 배열 선언
        const cafeList = ['롱비치', '비스타블루', '크로캣하우스', '인텐스491']

        // for ( let [반복요소] of [배열] )
        for( let cafe of cafeList ) {
            console.log(`추천 카페 : ${cafe}`);
        }
        
    </script>
</head>
<body>
    
</body>
</html>
