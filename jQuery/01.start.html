<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery</title>
    <!-- jQuery 라이브러리 포함하기 -->
    
    <!-- 1. 라이브러리 파일로 포함하기 -->
    <script src="js/jquery-4.0.0.min.js"></script>

    <!-- 2. CDN 방식으로 포함하기 -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

    <script>
        /* JavaScript 문서 준비 이벤트 */
        document.addEventListener("DOMContentLoaded", () => {})

        /* jQuery 문서 준비 이벤트 */
        $(document).ready(function() {
            alert("Hello jQuery~!")
        })
        /* jQuery 문서 준비 이벤트 축약형 */
        $(function() {
            alert("Hello jQuery~!")
            $('h1').text("Good Bye jQuery~!")
            // document.getElementsByTagName('h1')[0].textContent = "Good Bye jQuery~!"
        })
    </script>
</head>
<body>
    <h1>Hello jQuery~!</h1>
</body>
</html>
